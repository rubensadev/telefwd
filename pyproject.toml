[project]
name = "telewd"
version = "0.1.0"
description = "Telegram forwarder: subscribes to defined input channels/chats/groups and forwards messages to defined output channels."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["telegram", "forwarder", "userbot", "asyncio", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# Dependencies
dependencies = [
    "telethon>=1.29.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9"
]

# Optional / dev dependencies
[project.optional-dependencies]
dev = [
    "mypy>=1.6",
    "pytest>=7.4",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.0.321"
]

# Entry points (for CLI)
[project.scripts]
telefwd = "telefwd.main:main"

[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.mypy]

[[tool.mypy.overrides]]
module = ["telethon.*", "yaml.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
